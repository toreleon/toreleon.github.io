document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

5b;\">Fork it and start building your product. The plumbing every serious agent app needs is already here — readable, typed, and clean under <span style=\"font-family:'JetBrains Mono',monospace;font-size:14px;\">tsc<\u002Fspan> + <span style=\"font-family:'JetBrains Mono',monospace;font-size:14px;\">next build<\u002Fspan>.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"margin-top:44px;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px;\">\n    <div data-reveal=\"\" style=\"background:#fff;border:1px solid #ececec;border-radius:16px;padding:26px 24px;display:flex;flex-direction:column;gap:13px;\">\n      <div style=\"width:44px;height:44px;border-radius:11px;background:var(--ag-accent-soft,#10a37f1f);display:flex;align-items:center;justify-content:center;color:var(--ag-accent-strong,#0d8a6b);\"><i data-lucide=\"shield-check\" width=\"22\" height=\"22\"><\u002Fi><\u002Fdiv>\n      <div style=\"font-size:17px;font-weight:600;letter-spacing:-0.01em;\">Authentication<\u002Fdiv>\n      <div style=\"font-size:14.5px;line-height:1.6;color:#6b6b76;\">NextAuth with Credentials + GitHub, JWT sessions, a Prisma adapter, and bcrypt password hashing.<\u002Fdiv>\n    <\u002Fdiv>\n    <div data-reveal=\"\" data-delay=\"60\" style=\"background:#fff;border:1px solid #ececec;border-radius:16px;padding:26px 24px;display:flex;flex-direction:column;gap:13px;\">\n      <div style=\"width:44px;height:44px;border-radius:11px;background:var(--ag-accent-soft,#10a37f1f);display:flex;align-items:center;justify-content:center;color:var(--ag-accent-strong,#0d8a6b);\"><i data-lucide=\"activity\" width=\"22\" height=\"22\"><\u002Fi><\u002Fdiv>\n      <div style=\"font-size:17px;font-weight:600;letter-spacing:-0.01em;\">Streaming chat<\u002Fdiv>\n      <div style=\"font-size:14.5px;line-height:1.6;color:#6b6b76;\">Token-by-token SSE over the OpenAI Responses API, with a collapsible reasoning panel that persists across reloads.<\u002Fdiv>\n    <\u002Fdiv>\n    <div data-reveal=\"\" data-delay=\"120\" style=\"background:#fff;border:1px solid #ececec;border-radius:16px;padding:26px 24px;display:flex;flex-direction:column;gap:13px;\">\n      <div style=\"width:44px;height:44px;border-radius:11px;background:var(--ag-accent-soft,#10a37f1f);display:flex;align-items:center;justify-content:center;color:var(--ag-accent-strong,#0d8a6b);\"><i data-lucide=\"wrench\" width=\"22\" height=\"22\"><\u002Fi><\u002Fdiv>\n      <div style=\"font-size:17px;font-weight:600;letter-spacing:-0.01em;\">Built-in tools<\u002Fdiv>\n      <div style=\"font-size:14.5px;line-height:1.6;color:#6b6b76;\">Hosted web search with a keyless fallback, <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;\">run_javascript<\u002Fspan>, and time — add your own in one file.<\u002Fdiv>\n    <\u002Fdiv>\n    <div data-reveal=\"\" style=\"background:#fff;border:1px solid #ececec;border-radius:16px;padding:26px 24px;display:flex;flex-direction:column;gap:13px;\">\n      <div style=\"width:44px;height:44px;border-radius:11px;background:var(--ag-accent-soft,#10a37f1f);display:flex;align-items:center;justify-content:center;color:var(--ag-accent-strong,#0d8a6b);\"><i data-lucide=\"plug\" width=\"22\" height=\"22\"><\u002Fi><\u002Fdiv>\n      <div style=\"font-size:17px;font-weight:600;letter-spacing:-0.01em;\">MCP connectors<\u002Fdiv>\n      <div style=\"font-size:14.5px;line-height:1.6;color:#6b6b76;\">Register remote Streamable-HTTP servers with full OAuth 2.1: discovery, PKCE, callback, and automatic token refresh.<\u002Fdiv>\n    <\u002Fdiv>\n    <div data-reveal=\"\" data-delay=\"60\" style=\"background:#fff;border:1px solid #ececec;border-radius:16px;padding:26px 24px;display:flex;flex-direction:column;gap:13px;\">\n      <div style=\"width:44px;height:44px;border-radius:11px;background:var(--ag-accent-soft,#10a37f1f);display:flex;align-items:center;justify-content:center;color:var(--ag-accent-strong,#0d8a6b);\"><i data-lucide=\"telescope\" width=\"22\" height=\"22\"><\u002Fi><\u002Fdiv>\n      <div style=\"font-size:17px;font-weight:600;letter-spacing:-0.01em;\">Deep Research<\u002Fdiv>\n      <div style=\"font-size:14.5px;line-height:1.6;color:#6b6b76;\">A ChatGPT-style flow that asks clarifying questions, plans subtopics, reads ~12 sources, and streams a cited report inline.<\u002Fdiv>\n    <\u002Fdiv>\n    <div data-reveal=\"\" data-delay=\"120\" style=\"background:#fff;border:1px solid #ececec;border-radius:16px;padding:26px 24px;display:flex;flex-direction:column;gap:13px;\">\n      <div style=\"width:44px;height:44px;border-radius:11px;background:var(--ag-accent-soft,#10a37f1f);display:flex;align-items:center;justify-content:center;color:var(--ag-accent-strong,#0d8a6b);\"><i data-lucide=\"calendar-clock\" width=\"22\" height=\"22\"><\u002Fi><\u002Fdiv>\n      <div style=\"font-size:17px;font-weight:600;letter-spacing:-0.01em;\">Scheduled tasks<\u002Fdiv>\n      <div style=\"font-size:14.5px;line-height:1.6;color:#6b6b76;\">Save a prompt on a cron schedule; each fire seeds a fresh conversation and runs the agent for you, timezone-aware.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ ARCHITECTURE ============ -->\n<section id=\"architecture\" style=\"background:#f7f7f8;border-top:1px solid #ececec;border-bottom:1px solid #ececec;\">\n  <div style=\"max-width:1160px;margin:0 auto;padding:96px 24px;\">\n    <div data-reveal=\"\" style=\"max-width:660px;\">\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:0.08em;color:var(--ag-accent-strong,#0d8a6b);text-transform:uppercase;\">One clear path<\u002Fdiv>\n      <h2 style=\"margin:12px 0 0;font-size:clamp(28px,4vw,42px);letter-spacing:-0.025em;font-weight:700;line-height:1.08;\">A request in, a stream out.<\u002Fh2>\n      <p style=\"margin:16px 0 0;font-size:17px;line-height:1.6;color:#52525b;\">Every turn flows through the same rails: the composer POSTs, the route owns framing, the agent runtime streams the model, and typed SSE events land back in the store.<\u002Fp>\n    <\u002Fdiv>\n\n    <div data-reveal=\"\" style=\"margin-top:40px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;\">\n      <div style=\"background:#fff;border:1px solid #e6e6e8;border-radius:12px;padding:12px 15px;min-width:112px;\"><div style=\"font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:600;\">Browser<\u002Fdiv><div style=\"font-size:11.5px;color:#8b8b95;margin-top:2px;\">Zustand store<\u002Fdiv><\u002Fdiv>\n      <i data-lucide=\"chevron-right\" width=\"18\" height=\"18\" style=\"color:#c4c4cc;\"><\u002Fi>\n      <div style=\"background:#fff;border:1px solid #e6e6e8;border-radius:12px;padding:12px 15px;min-width:112px;\"><div style=\"font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:600;\">/api/chat<\u002Fdiv><div style=\"font-size:11.5px;color:#8b8b95;margin-top:2px;\">route · ownership<\u002Fdiv><\u002Fdiv>\n      <i data-lucide=\"chevron-right\" width=\"18\" height=\"18\" style=\"color:#c4c4cc;\"><\u002Fi>\n      <div style=\"background:#fff;border:1px solid #e6e6e8;border-radius:12px;padding:12px 15px;min-width:112px;\"><div style=\"font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:600;\">streamChat()<\u002Fdiv><div style=\"font-size:11.5px;color:#8b8b95;margin-top:2px;\">agent runtime<\u002Fdiv><\u002Fdiv>\n      <i data-lucide=\"chevron-right\" width=\"18\" height=\"18\" style=\"color:#c4c4cc;\"><\u002Fi>\n      <div style=\"background:#fff;border:1px solid #e6e6e8;border-radius:12px;padding:12px 15px;min-width:112px;\"><div style=\"font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:600;\">Responses API<\u002Fdiv><div style=\"font-size:11.5px;color:#8b8b95;margin-top:2px;\">deltas · tools<\u002Fdiv><\u002Fdiv>\n      <i data-lucide=\"chevron-right\" width=\"18\" height=\"18\" style=\"color:var(--ag-accent,#10a37f);\"><\u002Fi>\n      <div style=\"background:var(--ag-accent,#10a37f);border:1px solid var(--ag-accent,#10a37f);border-radius:12px;padding:12px 15px;min-width:100px;\"><div style=\"font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:600;color:#fff;\">SSE → UI<\u002Fdiv><div style=\"font-size:11.5px;color:rgba(255,255,255,0.82);margin-top:2px;\">token deltas<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"margin-top:36px;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px;\">\n      <div data-reveal=\"\" style=\"background:#fff;border:1px solid #ececec;border-radius:16px;padding:24px;\">\n        <div style=\"font-size:16px;font-weight:600;\">SSE protocol<\u002Fdiv>\n        <p style=\"margin:10px 0 0;font-size:14px;line-height:1.6;color:#6b6b76;\">A tiny <span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px;\">StreamEvent<\u002Fspan> union on the wire. <span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px;\">streamChat<\u002Fspan> yields the content events; the route owns <span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px;\">message_id<\u002Fspan>, <span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px;\">title<\u002Fspan>, and <span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px;\">done<\u002Fspan>.<\u002Fp>\n      <\u002Fdiv>\n      <div data-reveal=\"\" data-delay=\"60\" style=\"background:#fff;border:1px solid #ececec;border-radius:16px;padding:24px;\">\n        <div style=\"font-size:16px;font-weight:600;\">Data model<\u002Fdiv>\n        <p style=\"margin:10px 0 0;font-size:14px;line-height:1.6;color:#6b6b76;\">Prisma + SQLite: <span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px;\">User<\u002Fspan>, <span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px;\">Conversation<\u002Fspan>, <span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px;\">Message<\u002Fspan>, <span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px;\">McpServer<\u002Fspan>. Attachments, tool calls, and reasoning persist as JSON columns.<\u002Fp>\n      <\u002Fdiv>\n      <div data-reveal=\"\" data-delay=\"120\" style=\"background:#fff;border:1px solid #ececec;border-radius:16px;padding:24px;\">\n        <div style=\"font-size:16px;font-weight:600;\">Contracts<\u002Fdiv>\n        <p style=\"margin:10px 0 0;font-size:14px;line-height:1.6;color:#6b6b76;\">One authoritative <span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px;\">CONTRACTS.md<\u002Fspan>: nodejs runtime, ownership-by-404, JSON encode/decode, and strict SSE ordering.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div data-reveal=\"\" style=\"margin-top:28px;display:flex;align-items:center;gap:9px;flex-wrap:wrap;\">\n      <span style=\"font-size:12.5px;color:#8b8b95;margin-right:4px;\">StreamEvent union:<\u002Fspan>\n      <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#3f3f46;background:#fff;border:1px solid #e6e6e8;border-radius:7px;padding:4px 9px;\">delta<\u002Fspan>\n      <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#3f3f46;background:#fff;border:1px solid #e6e6e8;border-radius:7px;padding:4px 9px;\">reasoning_delta<\u002Fspan>\n      <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#3f3f46;background:#fff;border:1px solid #e6e6e8;border-radius:7px;padding:4px 9px;\">tool_call<\u002Fspan>\n      <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#3f3f46;background:#fff;border:1px solid #e6e6e8;border-radius:7px;padding:4px 9px;\">tool_result<\u002Fspan>\n      <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#3f3f46;background:#fff;border:1px solid #e6e6e8;border-radius:7px;padding:4px 9px;\">message_id<\u002Fspan>\n      <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#3f3f46;background:#fff;border:1px solid #e6e6e8;border-radius:7px;padding:4px 9px;\">title<\u002Fspan>\n      <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#3f3f46;background:#fff;border:1px solid #e6e6e8;border-radius:7px;padding:4px 9px;\">done<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ EXTEND ============ -->\n<section id=\"extend\" style=\"max-width:1160px;margin:0 auto;padding:96px 24px;\">\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:40px;align-items:center;\">\n    <div data-reveal=\"\">\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:0.08em;color:var(--ag-accent-strong,#0d8a6b);text-transform:uppercase;\">Made to extend<\u002Fdiv>\n      <h2 style=\"margin:12px 0 0;font-size:clamp(28px,4vw,42px);letter-spacing:-0.025em;font-weight:700;line-height:1.08;\">Extend it in a few lines.<\u002Fh2>\n      <p style=\"margin:16px 0 0;font-size:17px;line-height:1.6;color:#52525b;\">The whole point of a template. Every extension point is a small, local edit — define a tool, register a model, or add a connector with no code at all.<\u002Fp>\n      <div style=\"margin-top:24px;display:flex;flex-direction:column;gap:14px;\">\n        <div style=\"display:flex;gap:11px;align-items:flex-start;\"><span style=\"color:var(--ag-accent,#10a37f);margin-top:1px;\"><i data-lucide=\"check\" width=\"19\" height=\"19\"><\u002Fi><\u002Fspan><div style=\"font-size:15px;line-height:1.55;color:#3f3f46;\"><b style=\"color:#0d0d0d;\">Tools<\u002Fb> — a <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;\">tool()<\u002Fspan> helper + a Zod schema, registered in one array.<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex;gap:11px;align-items:flex-start;\"><span style=\"color:var(--ag-accent,#10a37f);margin-top:1px;\"><i data-lucide=\"check\" width=\"19\" height=\"19\"><\u002Fi><\u002Fspan><div style=\"font-size:15px;line-height:1.55;color:#3f3f46;\"><b style=\"color:#0d0d0d;\">Models<\u002Fb> — one entry in the picker; point at OpenAI or Azure.<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex;gap:11px;align-items:flex-start;\"><span style=\"color:var(--ag-accent,#10a37f);margin-top:1px;\"><i data-lucide=\"check\" width=\"19\" height=\"19\"><\u002Fi><\u002Fspan><div style=\"font-size:15px;line-height:1.55;color:#3f3f46;\"><b style=\"color:#0d0d0d;\">Connectors<\u002Fb> — add by name + URL; OAuth is handled for you.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div data-reveal=\"\" data-delay=\"120\" data-codewrap=\"\" style=\"background:#0d0d0d;border:1px solid #1e1e1e;border-radius:16px;overflow:hidden;box-shadow:0 30px 70px -40px rgba(16,24,40,0.5);\">\n      <div data-codetabs=\"\" style=\"display:flex;gap:4px;padding:10px 10px 0;background:#141414;border-bottom:1px solid #1e1e1e;\">\n        <button data-tabbtn=\"\" data-tab=\"0\" sc-camel-on-click=\"{{handleTab}}\" style=\"border:none;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:12.5px;font-weight:500;padding:8px 14px;border-radius:8px 8px 0 0;background:#0d0d0d;color:#ececec;\">Add a tool<\u002Fbutton>\n        <button data-tabbtn=\"\" data-tab=\"1\" sc-camel-on-click=\"{{handleTab}}\" style=\"border:none;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:12.5px;font-weight:500;padding:8px 14px;border-radius:8px 8px 0 0;background:transparent;color:#8b8b95;\">Add a model<\u002Fbutton>\n        <button data-tabbtn=\"\" data-tab=\"2\" sc-camel-on-click=\"{{handleTab}}\" style=\"border:none;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:12.5px;font-weight:500;padding:8px 14px;border-radius:8px 8px 0 0;background:transparent;color:#8b8b95;\">Connector<\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"padding:20px 22px;overflow-x:auto;\">\n        <pre data-pane=\"0\" style=\"margin:0;display:block;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.7;color:#c9d1d9;\"><span style=\"color:#ff7b72;\">import<\u002Fspan> { tool } <span style=\"color:#ff7b72;\">from<\u002Fspan> <span style=\"color:#a5d6ff;\">\"@openai/agents\"<\u002Fspan>;\n<span style=\"color:#ff7b72;\">import<\u002Fspan> { z } <span style=\"color:#ff7b72;\">from<\u002Fspan> <span style=\"color:#a5d6ff;\">\"zod\"<\u002Fspan>;\n\n<span style=\"color:#ff7b72;\">export const<\u002Fspan> <span style=\"color:#79c0ff;\">uppercaseTool<\u002Fspan> = <span style=\"color:#d2a8ff;\">tool<\u002Fspan>({\n  name: <span style=\"color:#a5d6ff;\">\"uppercase\"<\u002Fspan>,\n  description: <span style=\"color:#a5d6ff;\">\"Uppercase a string.\"<\u002Fspan>,\n  parameters: z.<span style=\"color:#d2a8ff;\">object<\u002Fspan>({\n    text: z.<span style=\"color:#d2a8ff;\">string<\u002Fspan>().<span style=\"color:#d2a8ff;\">describe<\u002Fspan>(<span style=\"color:#a5d6ff;\">\"Text to shout.\"<\u002Fspan>),\n  }),\n  <span style=\"color:#ff7b72;\">async<\u002Fspan> <span style=\"color:#d2a8ff;\">execute<\u002Fspan>({ text }) {\n    <span style=\"color:#ff7b72;\">return<\u002Fspan> { result: text.<span style=\"color:#d2a8ff;\">toUpperCase<\u002Fspan>() };\n  },\n});<\u002Fpre>\n        <pre data-pane=\"1\" style=\"margin:0;display:none;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.7;color:#c9d1d9;\"><span style=\"color:#8b949e;\">// src/lib/types.ts — shown in the picker.<\u002Fspan>\n<span style=\"color:#ff7b72;\">export const<\u002Fspan> <span style=\"color:#79c0ff;\">MODELS<\u002Fspan>: <span style=\"color:#ffa657;\">AvailableModel<\u002Fspan>[] = [\n  {\n    id: <span style=\"color:#a5d6ff;\">\"gpt-5.4-mini\"<\u002Fspan>,\n    label: <span style=\"color:#a5d6ff;\">\"GPT-5.4 mini\"<\u002Fspan>,\n    description: <span style=\"color:#a5d6ff;\">\"Fast, capable for most tasks\"<\u002Fspan>,\n  },\n  {\n    id: <span style=\"color:#a5d6ff;\">\"gpt-5.4\"<\u002Fspan>,\n    label: <span style=\"color:#a5d6ff;\">\"GPT-5.4\"<\u002Fspan>,\n    description: <span style=\"color:#a5d6ff;\">\"Higher quality, slower\"<\u002Fspan>,\n  },\n];<\u002Fpre>\n        <pre data-pane=\"2\" style=\"margin:0;display:none;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.7;color:#c9d1d9;\"><span style=\"color:#8b949e;\">// No code required.<\u002Fspan>\n<span style=\"color:#8b949e;\">// Settings → Connectors → add name + URL.<\u002Fspan>\n\n<span style=\"color:#8b949e;\">// If the server needs auth, OpenAgent runs<\u002Fspan>\n<span style=\"color:#8b949e;\">// the full OAuth 2.1 flow for you:<\u002Fspan>\n\n  discover  <span style=\"color:#ff7b72;\">→<\u002Fspan> register <span style=\"color:#ff7b72;\">→<\u002Fspan> PKCE\n  authorize <span style=\"color:#ff7b72;\">→<\u002Fspan> callback  <span style=\"color:#ff7b72;\">→<\u002Fspan> refresh\n\n<span style=\"color:#8b949e;\">// Once trusted, its tools load every turn.<\u002Fspan><\u002Fpre>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ QUICK START ============ -->\n<section id=\"quickstart\" style=\"background:#0d0d0d;color:#ececec;\">\n  <div style=\"max-width:1160px;margin:0 auto;padding:96px 24px;\">\n    <div data-reveal=\"\" style=\"max-width:660px;\">\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:0.08em;color:var(--ag-accent,#10a37f);text-transform:uppercase;\">Get started<\u002Fdiv>\n      <h2 style=\"margin:12px 0 0;font-size:clamp(28px,4vw,42px);letter-spacing:-0.025em;font-weight:700;line-height:1.08;color:#fff;\">Running in four commands.<\u002Fh2>\n      <p style=\"margin:16px 0 0;font-size:17px;line-height:1.6;color:#a1a1aa;\">Node 18.18+ and an OpenAI key (or any compatible endpoint). Then open <span style=\"font-family:'JetBrains Mono',monospace;font-size:14px;color:#ececec;\">localhost:3000<\u002Fspan>, sign up, and start chatting.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"margin-top:44px;display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;\">\n      <div data-reveal=\"\" style=\"background:#141414;border:1px solid #262626;border-radius:14px;padding:22px;\">\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ag-accent,#10a37f);\">01<\u002Fdiv>\n        <div style=\"margin-top:10px;font-size:15px;font-weight:600;color:#fff;\">Install<\u002Fdiv>\n        <div style=\"margin-top:14px;font-family:'JetBrains Mono',monospace;font-size:12.5px;color:#c9d1d9;\"><span style=\"color:#6b6b76;\">$<\u002Fspan> npm install<\u002Fdiv>\n      <\u002Fdiv>\n      <div data-reveal=\"\" data-delay=\"60\" style=\"background:#141414;border:1px solid #262626;border-radius:14px;padding:22px;\">\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ag-accent,#10a37f);\">02<\u002Fdiv>\n        <div style=\"margin-top:10px;font-size:15px;font-weight:600;color:#fff;\">Configure<\u002Fdiv>\n        <div style=\"margin-top:14px;font-family:'JetBrains Mono',monospace;font-size:12.5px;color:#c9d1d9;\"><span style=\"color:#6b6b76;\">$<\u002Fspan> cp .env.example .env<\u002Fdiv>\n      <\u002Fdiv>\n      <div data-reveal=\"\" data-delay=\"120\" style=\"background:#141414;border:1px solid #262626;border-radius:14px;padding:22px;\">\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ag-accent,#10a37f);\">03<\u002Fdiv>\n        <div style=\"margin-top:10px;font-size:15px;font-weight:600;color:#fff;\">Create the DB<\u002Fdiv>\n        <div style=\"margin-top:14px;font-family:'JetBrains Mono',monospace;font-size:12.5px;color:#c9d1d9;\"><span style=\"color:#6b6b76;\">$<\u002Fspan> npm run db:push<\u002Fdiv>\n      <\u002Fdiv>\n      <div data-reveal=\"\" data-delay=\"180\" style=\"background:#141414;border:1px solid #262626;border-radius:14px;padding:22px;\">\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ag-accent,#10a37f);\">04<\u002Fdiv>\n        <div style=\"margin-top:10px;font-size:15px;font-weight:600;color:#fff;\">Run<\u002Fdiv>\n        <div style=\"margin-top:14px;font-family:'JetBrains Mono',monospace;font-size:12.5px;color:#c9d1d9;\"><span style=\"color:#6b6b76;\">$<\u002Fspan> npm run dev<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ TECH STRIP ============ -->\n<section style=\"max-width:1160px;margin:0 auto;padding:72px 24px;text-align:center;\">\n  <div data-reveal=\"\" style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:0.1em;color:#9a9aa2;text-transform:uppercase;\">Built with<\u002Fdiv>\n  <div data-reveal=\"\" data-delay=\"60\" style=\"margin-top:22px;display:flex;flex-wrap:wrap;gap:10px;justify-content:center;\">\n    <span style=\"font-size:14px;font-weight:500;color:#3f3f46;background:#f7f7f8;border:1px solid #ececec;border-radius:999px;padding:8px 16px;\">Next.js 14<\u002Fspan>\n    <span style=\"font-size:14px;font-weight:500;color:#3f3f46;background:#f7f7f8;border:1px solid #ececec;border-radius:999px;padding:8px 16px;\">React 18<\u002Fspan>\n    <span style=\"font-size:14px;font-weight:500;color:#3f3f46;background:#f7f7f8;border:1px solid #ececec;border-radius:999px;padding:8px 16px;\">TypeScript<\u002Fspan>\n    <span style=\"font-size:14px;font-weight:500;color:#3f3f46;background:#f7f7f8;border:1px solid #ececec;border-radius:999px;padding:8px 16px;\">OpenAI Agents SDK<\u002Fspan>\n    <span style=\"font-size:14px;font-weight:500;color:#3f3f46;background:#f7f7f8;border:1px solid #ececec;border-radius:999px;padding:8px 16px;\">NextAuth<\u002Fspan>\n    <span style=\"font-size:14px;font-weight:500;color:#3f3f46;background:#f7f7f8;border:1px solid #ececec;border-radius:999px;padding:8px 16px;\">Prisma<\u002Fspan>\n    <span style=\"font-size:14px;font-weight:500;color:#3f3f46;background:#f7f7f8;border:1px solid #ececec;border-radius:999px;padding:8px 16px;\">SQLite<\u002Fspan>\n    <span style=\"font-size:14px;font-weight:500;color:#3f3f46;background:#f7f7f8;border:1px solid #ececec;border-radius:999px;padding:8px 16px;\">Zustand<\u002Fspan>\n    <span style=\"font-size:14px;font-weight:500;color:#3f3f46;background:#f7f7f8;border:1px solid #ececec;border-radius:999px;padding:8px 16px;\">Tailwind CSS<\u002Fspan>\n    <span style=\"font-size:14px;font-weight:500;color:#3f3f46;background:#f7f7f8;border:1px solid #ececec;border-radius:999px;padding:8px 16px;\">Zod<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ CTA ============ -->\n<section style=\"max-width:1160px;margin:0 auto;padding:0 24px 96px;\">\n  <div data-reveal=\"\" style=\"position:relative;overflow:hidden;background:var(--ag-accent,#10a37f);border-radius:24px;padding:64px 32px;text-align:center;\">\n    <h2 style=\"margin:0;font-size:clamp(26px,3.6vw,38px);letter-spacing:-0.02em;font-weight:700;color:#fff;line-height:1.1;\">Start building your agent today.<\u002Fh2>\n    <p style=\"margin:14px auto 0;max-width:520px;font-size:16.5px;line-height:1.55;color:rgba(255,255,255,0.9);\">Clone the repo, add your key, and ship. The boring parts are already done.<\u002Fp>\n    <div style=\"margin-top:28px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap;\">\n      <a href=\"#quickstart\" style=\"background:#fff;color:#0d0d0d;padding:13px 24px;border-radius:11px;font-weight:600;font-size:15px;display:inline-flex;align-items:center;gap:8px;\">Get started <i data-lucide=\"arrow-right\" width=\"18\" height=\"18\"><\u002Fi><\u002Fa>\n      <a href=\"{{githubUrl}}\" style=\"background:rgba(255,255,255,0.14);color:#fff;border:1px solid rgba(255,255,255,0.3);padding:13px 22px;border-radius:11px;font-weight:600;font-size:15px;display:inline-flex;align-items:center;gap:8px;\"><svg sc-camel-view-box=\"0 0 24 24\" width=\"18\" height=\"18\" fill=\"currentColor\" aria-hidden=\"true\"><path d=\"M12 .5C5.73.5.5 5.73.5 12a11.5 11.5 0 0 0 7.86 10.94c.58.11.79-.25.79-.56 0-.28-.01-1.02-.02-2-3.2.7-3.88-1.54-3.88-1.54-.52-1.33-1.28-1.68-1.28-1.68-1.05-.72.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.73-1.55-2.55-.29-5.24-1.28-5.24-5.69 0-1.26.45-2.29 1.19-3.1-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.18 1.18a11 11 0 0 1 5.8 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.84 1.19 3.1 0 4.42-2.69 5.4-5.25 5.68.41.36.78 1.05.78 2.12 0 1.53-.01 2.76-.01 3.14 0 .31.21.68.8.56A11.5 11.5 0 0 0 23.5 12C23.5 5.73 18.27.5 12 .5Z\"><\u002Fpath><\u002Fsvg> View source<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ FOOTER ============ -->\n<footer style=\"background:#0d0d0d;color:#a1a1aa;\">\n  <div style=\"max-width:1160px;margin:0 auto;padding:56px 24px 40px;\">\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:36px;\">\n      <div>\n        <a href=\"#top\" style=\"display:flex;align-items:center;gap:10px;color:#fff;font-weight:600;font-size:17px;\">\n          <span style=\"width:27px;height:27px;border-radius:8px;background:var(--ag-accent,#10a37f);display:inline-flex;align-items:center;justify-content:center;color:#fff;\"><svg sc-camel-view-box=\"0 0 24 24\" width=\"17\" height=\"17\" fill=\"none\" aria-hidden=\"true\"><path d=\"M19.52 9.26 A8 8 0 1 1 14.74 4.52\" stroke=\"currentColor\" stroke-width=\"2.4\" fill=\"none\" stroke-linecap=\"round\"><\u002Fpath><circle cx=\"12\" cy=\"12\" r=\"3\" fill=\"currentColor\"><\u002Fcircle><circle cx=\"17.66\" cy=\"6.34\" r=\"2\" fill=\"currentColor\"><\u002Fcircle><\u002Fsvg><\u002Fspan>\n          OpenAgent\n        <\u002Fa>\n        <p style=\"margin:16px 0 0;font-size:13.5px;line-height:1.6;color:#8b8b95;max-width:260px;\">A production template for agent apps. Built on Next.js and the OpenAI Agents SDK.<\u002Fp>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font-size:13px;font-weight:600;color:#ececec;\">Product<\u002Fdiv>\n        <div style=\"margin-top:14px;display:flex;flex-direction:column;gap:10px;\">\n          <a href=\"#features\" style=\"font-size:13.5px;color:#a1a1aa;\">Features<\u002Fa>\n          <a href=\"#architecture\" style=\"font-size:13.5px;color:#a1a1aa;\">Architecture<\u002Fa>\n          <a href=\"#extend\" style=\"font-size:13.5px;color:#a1a1aa;\">Extend<\u002Fa>\n          <a href=\"#quickstart\" style=\"font-size:13.5px;color:#a1a1aa;\">Quick start<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font-size:13px;font-weight:600;color:#ececec;\">Resources<\u002Fdiv>\n        <div style=\"margin-top:14px;display:flex;flex-direction:column;gap:10px;\">\n          <a href=\"{{githubUrl}}\" style=\"font-size:13.5px;color:#a1a1aa;\">README<\u002Fa>\n          <a href=\"{{githubUrl}}\" style=\"font-size:13.5px;color:#a1a1aa;\">CONTRACTS.md<\u002Fa>\n          <a href=\"{{githubUrl}}\" style=\"font-size:13.5px;color:#a1a1aa;\">Agents SDK<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font-size:13px;font-weight:600;color:#ececec;\">Community<\u002Fdiv>\n        <div style=\"margin-top:14px;display:flex;flex-direction:column;gap:10px;\">\n          <a href=\"{{githubUrl}}\" style=\"font-size:13.5px;color:#a1a1aa;\">GitHub<\u002Fa>\n          <a href=\"{{githubUrl}}\" style=\"font-size:13.5px;color:#a1a1aa;\">Issues<\u002Fa>\n          <a href=\"{{githubUrl}}\" style=\"font-size:13.5px;color:#a1a1aa;\">Discussions<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"margin-top:44px;padding-top:22px;border-top:1px solid #1e1e1e;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;font-size:12.5px;color:#6b6b76;\">\n      <span>© 2026 OpenAgent. An open-source template.<\u002Fspan>\n      <span style=\"font-family:'JetBrains Mono',monospace;\">Built on Next.js &amp; the OpenAI Agents SDK<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Ffooter>\n\n\n\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;accentColor&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:[&quot;#111827&quot;,&quot;#000000&quot;],&quot;options&quot;:[[&quot;#10a37f&quot;,&quot;#0d8a6b&quot;],[&quot;#2a6fdb&quot;,&quot;#215bb5&quot;],[&quot;#7c5cff&quot;,&quot;#6544e0&quot;],[&quot;#e0632f&quot;,&quot;#c14f22&quot;],[&quot;#111827&quot;,&quot;#000000&quot;]],&quot;tsType&quot;:&quot;string[]&quot;,&quot;section&quot;:&quot;Theme&quot;},&quot;githubUrl&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;https://github.com/toreleon/agent-app-template&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Content&quot;}}\">\nclass Component extends DCLogic {\n  renderVals() {\n    const pal = this.props.accentColor;\n    let a = '#10a37f', s = '#0d8a6b';\n    if (Array.isArray(pal)) { a = pal[0] || a; s = pal[1] || pal[0] || s; }\n    else if (typeof pal === 'string' && pal) { a = pal; s = pal; }\n    const soft = (typeof a === 'string' && a.length === 7) ? a + '22' : 'rgba(16,163,127,0.13)';\n    const handleTab = (e) => {\n      const btn = e.currentTarget;\n      const idx = Number(btn.getAttribute('data-tab'));\n      const wrap = btn.closest('[data-codewrap]');\n      if (!wrap) return;\n      wrap.querySelectorAll('[data-tabbtn]').forEach((b) => {\n        const on = Number(b.getAttribute('data-tab')) === idx;\n        b.style.background = on ? '#0d0d0d' : 'transparent';\n        b.style.color = on ? '#ececec' : '#8b8b95';\n      });\n      wrap.querySelectorAll('[data-pane]').forEach((p) => {\n        p.style.display = (Number(p.getAttribute('data-pane')) === idx) ? 'block' : 'none';\n      });\n    };\n    const selectView = (e) => {\n      const el = e.currentTarget;\n      const view = el.getAttribute('data-nav');\n      const win = el.closest('[data-appwin]');\n      if (!win) return;\n      win.querySelectorAll('[data-nav]').forEach((n) => {\n        const on = n.getAttribute('data-nav') === view;\n        n.style.background = on ? '#ececee' : 'transparent';\n        n.style.color = on ? '#0d0d0d' : '#3f3f46';\n      });\n      win.querySelectorAll('[data-view]').forEach((v) => {\n        const on = v.getAttribute('data-view') === view;\n        v.style.display = on ? (v.getAttribute('data-disp') || 'block') : 'none';\n      });\n    };\n    return {\n      accent: a,\n      accentStrong: s,\n      accentSoft: soft,\n      githubUrl: this.props.githubUrl || 'https://github.com/toreleon/agent-app-template',\n      handleTab,\n      selectView,\n    };\n  }\n\n  componentDidMount() {\n    this._drawIcons();\n    this._setupReveal();\n    this._setupChatAnim();\n    this._setup3D();\n  }\n\n  componentWillUnmount() {\n    if (this._raf) cancelAnimationFrame(this._raf);\n    if (this._io) this._io.disconnect();\n    if (this._iconIv) clearInterval(this._iconIv);\n    if (this._onScroll) { window.removeEventListener('scroll', this._onScroll); window.removeEventListener('resize', this._onScroll); }\n    if (this._tick) cancelAnimationFrame(this._tick);\n  }\n\n  _setup3D() {\n    const tilt = document.getElementById('ag-tilt');\n    if (!tilt) return;\n    const clamp = (x) => (x < 0 ? 0 : x > 1 ? 1 : x);\n    const update = () => {\n      const rect = tilt.getBoundingClientRect();\n      const vh = window.innerHeight || 800;\n      const start = vh * 0.95, end = vh * 0.20;\n      const t = clamp((start - rect.top) / (start - end));\n      const rx = (15 * (1 - t)).toFixed(2);\n      const sc = (0.93 + 0.07 * t).toFixed(3);\n      tilt.style.transform = 'rotateX(' + rx + 'deg) scale(' + sc + ')';\n    };\n    update();\n    this._onScroll = () => {\n      if (this._tick) return;\n      this._tick = requestAnimationFrame(() => { this._tick = null; update(); });\n    };\n    window.addEventListener('scroll', this._onScroll, { passive: true });\n    window.addEventListener('resize', this._onScroll, { passive: true });\n  }\n\n  _drawIcons() {\n    const run = () => { if (window.lucide && window.lucide.createIcons) { window.lucide.createIcons(); return true; } return false; };\n    if (run()) return;\n    let tries = 0;\n    this._iconIv = setInterval(() => { tries++; if (run() || tries > 40) clearInterval(this._iconIv); }, 120);\n  }\n\n  _setupReveal() {\n    const els = Array.from(document.querySelectorAll('[data-reveal]'));\n    els.forEach((el) => {\n      el.style.opacity = '0';\n      el.style.transform = 'translateY(22px)';\n      el.style.transition = 'opacity .7s cubic-bezier(.16,1,.3,1), transform .7s cubic-bezier(.16,1,.3,1)';\n      el.style.willChange = 'opacity, transform';\n    });\n    if (!('IntersectionObserver' in window)) {\n      els.forEach((el) => { el.style.opacity = '1'; el.style.transform = 'none'; });\n      return;\n    }\n    this._io = new IntersectionObserver((ents) => {\n      ents.forEach((en) => {\n        if (en.isIntersecting) {\n          const el = en.target;\n          const d = Number(el.getAttribute('data-delay') || 0);\n          el.style.transitionDelay = d + 'ms';\n          el.style.opacity = '1';\n          el.style.transform = 'none';\n          this._io.unobserve(el);\n        }\n      });\n    }, { threshold: 0.12, rootMargin: '0px 0px -8% 0px' });\n    els.forEach((el) => this._io.observe(el));\n  }\n\n  _setupChatAnim() {\n    const think = document.getElementById('ag-think');\n    const worked = document.getElementById('ag-worked');\n    const actions = document.getElementById('ag-actions');\n    const words = Array.from(document.querySelectorAll('#ag-words [data-w]'));\n    const cursor = document.getElementById('ag-cursor');\n    if (!words.length) return;\n    const clamp = (x) => (x < 0 ? 0 : x > 1 ? 1 : x);\n    const DUR = 6800;\n    let start = null;\n    const frame = (now) => {\n      if (start === null) start = now;\n      const t = ((now - start) % DUR) / DUR;\n      if (think) think.style.opacity = (t > 0.08 && t < 0.40) ? '1' : '0';\n      if (worked) worked.style.opacity = (t > 0.42 && t < 0.97) ? '1' : '0';\n      const rc = Math.floor(clamp((t - 0.44) / 0.34) * (words.length + 0.001));\n      words.forEach((w, i) => {\n        const on = i < rc;\n        w.style.opacity = on ? '1' : '0';\n        w.style.transform = on ? 'none' : 'translateY(4px)';\n      });\n      if (cursor) cursor.style.display = (t > 0.44 && t < 0.90 && rc > 0) ? 'inline-block' : 'none';\n      if (actions) actions.style.opacity = (t > 0.90 && t < 0.97) ? '1' : '0';\n      this._raf = requestAnimationFrame(frame);\n    };\n    this._raf = requestAnimationFrame(frame);\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
